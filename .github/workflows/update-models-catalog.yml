name: Update Model Catalog

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      cutoff_days:
        description: 'Retention window in days (default: 180 for 6 months)'
        required: false
        default: '180'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run catalog update script
        run: |
          CUTOFF="${{ github.event.inputs.cutoff_days || 180 }}"
          python scripts/update_model_catalog.py --cutoff-days "$CUTOFF"

      - name: Validate updated catalog with pytest and ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest tests/test_model_catalog.py tests/test_xpx_models.py

      - name: Commit and push changes directly to master
        run: |
          if git diff --quiet data/model-catalog.json; then
            echo "No changes to model-catalog.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model-catalog.json
          TODAY=$(date -u +'%Y-%m-%d')
          git commit -m "chore(catalog): auto-update model catalog for ${TODAY} [skip ci]"
          git push origin master
