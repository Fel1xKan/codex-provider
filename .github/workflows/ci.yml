name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: cpx --help
      - run: opx --help
      - run: apx --help
      - run: cupx --help
      - run: clpx --help

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/cpx
            dist/cpx.exe
            dist/cpx.sha256
            dist/cpx.exe.sha256
            dist/opx
            dist/opx.exe
            dist/opx.sha256
            dist/opx.exe.sha256
            dist/apx
            dist/apx.exe
            dist/apx.sha256
            dist/apx.exe.sha256
            dist/cupx
            dist/cupx.exe
            dist/cupx.sha256
            dist/cupx.exe.sha256
            dist/clpx
            dist/clpx.exe
            dist/clpx.sha256
            dist/clpx.exe.sha256
          if-no-files-found: error
