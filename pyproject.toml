[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xpx"
dynamic = ["version"]
description = "Unified AI Agent Provider Control Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "json5>=0.12,<1",
  "pyyaml>=6.0",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.21.0",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
xpx = "cli.xpx:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
  "cli",
  "lib",
  "lib.common",
  "lib.xpx",
  "lib.xpx.store",
  "lib.xpx.models",
  "lib.xpx.adapters",
  "lib.xpx.commands",
  "lib.xpx.accounts",
]

[tool.setuptools.dynamic]
version = { attr = "lib.common.constants.VERSION" }

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
