[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-provider"
dynamic = ["version"]
description = "Default provider and model switcher for OpenCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "json5>=0.12,<1",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.21.0",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
codex-provider = "cli.codex_provider:main"
opencode-provider = "cli.opencode_provider:main"
agy-provider = "cli.agy_provider:main"
cursor-provider = "cli.cursor_provider:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cli", "lib", "lib.common", "lib.codex", "lib.opencode", "lib.agy", "lib.cursor"]

[tool.setuptools.dynamic]
version = { attr = "lib.common.constants.VERSION" }

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
